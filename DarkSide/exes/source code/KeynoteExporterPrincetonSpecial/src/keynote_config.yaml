# KeynoteExporter PrincetonSpecial Configuration File
# This file defines the PrincetonSpecial column mappings and data types for Excel parsing

# Excel file settings
excel:
  sheet_name: "Database"
  header_search_rows: 10  # Number of rows to search for headers
  expected_headers:  # Headers to look for when finding the header row
    - "BldgId"
    - "FORMAT"
    - "DIVISION #"
    - "DIVISION NAME"
    - "SECTION #"
    - "SECTION NAME"
    - "KEYNOTE #"
    - "KEYNOTE DESCRIPTION"

# Column type definitions
column_types:
  # String columns - these will be treated as text fields
  string_columns:
    - "BldgId"
    - "FORMAT"
    - "DIVISION #"
    - "DIVISION NAME"
    - "SECTION #"
    - "SECTION NAME"
    - "KEYNOTE #"
    - "KEYNOTE DESCRIPTION"
    - "SOURCE"
    - "PRODUCT"
    - "CAT. NO."
    - "COLOR"
    - "FINISH"
    - "SIZE"
    - "CONTACT"
    - "REMARKS"

  # Interior scope columns (I-N) - these will be treated as boolean fields
  interior_scope_columns:
    - "BASE"
    - "INT. WALL"
    - "CEILING"
    - "FLOOR"
    - "MILLWORK"
    - "INT. OTHER"
  
  # Exterior scope columns (O-T) - these will be treated as boolean fields
  exterior_scope_columns:
    - "ROOF"
    - "EXT. WALL"
    - "FENESTRATION"
    - "SOFFIT"
    - "PAVING"
    - "EXT. OTHER"

# Data handling settings
data_handling:
  # How to handle missing values
  missing_values:
    string_default: ""  # Default value for string columns when empty
    boolean_default: false  # Default value for boolean columns when empty
  
  # Boolean conversion rules
  boolean_conversion:
    # Simple rule: any non-empty value = True, any empty value = False
    # This means any text, number, or content will be treated as True
    # Only empty cells, NaN, or whitespace-only will be treated as False
    true_values: []  # Not used - any non-empty content is True
    false_values: []  # Not used - only empty content is False

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "keynote_exporter.log"
  console_output: true
